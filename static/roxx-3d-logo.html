<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROXX 3D Logo</title>
<style>
:root{--bg:#000;--fg:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--fg);font:12px/1 system-ui,sans-serif;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(35,1,0.1,100);
camera.position.set(0,0,9);

// studio-like environment for chrome reflections
var ec=document.createElement('canvas');ec.width=1024;ec.height=512;
var g=ec.getContext('2d');
var gr=g.createLinearGradient(0,0,0,512);
gr.addColorStop(0,'#cfcfcf');gr.addColorStop(.45,'#3a3a3a');gr.addColorStop(.55,'#101010');gr.addColorStop(1,'#8a8a8a');
g.fillStyle=gr;g.fillRect(0,0,1024,512);
g.fillStyle='#fff';
[[60,120,90,260],[300,60,40,330],[520,140,140,200],[760,80,60,300],[920,160,70,220]].forEach(function(r){g.fillRect(r[0],r[1],r[2],r[3]);});
g.fillStyle='#000';
[[200,100,50,300],[650,100,40,320]].forEach(function(r){g.fillRect(r[0],r[1],r[2],r[3]);});
var envTex=new THREE.CanvasTexture(ec);envTex.mapping=THREE.EquirectangularReflectionMapping;
var pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromEquirectangular(envTex).texture;

// logo traced from the uploaded image (px coords, 374x666)
var S=60,cx=185,cy=335;
function P(x,y){return new THREE.Vector2((x-cx)/S,-(y-cy)/S);}
var outer=[[92,250],[158,292],[190,248],[222,290],[291,263],[250,327],[295,355],[248,378],[268,410],[235,395],[182,422],[130,392],[96,402],[122,372],[76,340],[122,318]];
var eyeL=[[134,350],[150,344],[166,358],[162,376],[147,380],[135,366]];
var eyeR=[[196,352],[212,346],[230,350],[224,370],[208,382],[194,372]];
var shape=new THREE.Shape(outer.map(function(p){return P(p[0],p[1]);}));
[eyeL,eyeR].forEach(function(e){shape.holes.push(new THREE.Path(e.map(function(p){return P(p[0],p[1]);})));});
var geo=new THREE.ExtrudeGeometry(shape,{depth:0.55,bevelEnabled:true,bevelThickness:0.09,bevelSize:0.06,bevelSegments:4,curveSegments:8});
geo.center();
var mat=new THREE.MeshStandardMaterial({color:0xdcdcdc,metalness:1,roughness:0.16,envMapIntensity:1.4});
var logo=new THREE.Mesh(geo,mat);
scene.add(logo);
var key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(3,4,6);scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff,0.25));

function resize(){
  var w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.position.z=w/h<0.8?13:9;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

var dragging=false,lastX=0,offset=0,vel=0;
canvas.addEventListener('pointerdown',function(e){dragging=true;lastX=e.clientX;canvas.style.cursor='grabbing';});
addEventListener('pointerup',function(){dragging=false;canvas.style.cursor='grab';});
addEventListener('pointermove',function(e){if(dragging){var d=(e.clientX-lastX)*0.012;offset+=d;lastX=e.clientX;}});

var clock=new THREE.Clock(),base=0;
(function loop(){
  requestAnimationFrame(loop);
  var dt=clock.getDelta();
  if(!dragging){base+=dt*(Math.PI*2/6);} // full 360° every 6 seconds
  logo.rotation.y=base+offset;
  logo.rotation.x=Math.sin(clock.elapsedTime*0.6)*0.08;
  renderer.render(scene,camera);
})();
})();
</script>
</body>
</html>
