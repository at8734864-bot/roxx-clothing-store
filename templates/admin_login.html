<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ROXX Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: #f5f3eb;
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
        }

        .box {
            width: min(420px, 92%);
            padding: 38px;
            background: #1b1b1b;
            border: 1px solid #383838;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 8px;
            letter-spacing: -2px;
        }

        p {
            color: #aaa;
        }

        input, button {
            width: 100%;
            padding: 15px;
            margin-top: 14px;
            border: 0;
        }

        button {
            background: #c7f36b;
            font-weight: 800;
            cursor: pointer;
        }

        .error {
            color: #ff8b8b;
        }
    </style>
</head>

<body>

    <form class="box" method="post">

        <h1>
            ROXX<span style="color:#c7f36b">.</span>
        </h1>

        <p>STORE ADMINISTRATION</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <input
            type="text"
            name="username"
            placeholder="Admin username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Admin password"
            required
        >

        <button type="submit">SIGN IN</button>

    </form>

</body>
</html>
