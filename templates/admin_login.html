<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ROXX | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #1b1b1b;
            padding: 40px;
            border: 1px solid #333;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #444;
            background: #0d0d0d;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            background: #4b1717;
            border: 1px solid #873333;
            padding: 12px;
            margin-bottom: 20px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
            text-align: center;
        }

        .back:hover {
            color: white;
        }

    </style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        ROXX
    </div>

    <div class="subtitle">
        ADMIN PANEL
    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="error">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('admin_login') }}"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Admin username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Admin password"
            required
        >


        <button type="submit">
            LOGIN
        </button>

    </form>


    <a
        href="/"
        class="back"
    >
        ← Back to ROXX
    </a>

</div>

</body>

</html>
